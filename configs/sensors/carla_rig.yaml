# Sensor rig (simulation-backends.md section 2). Mounts: library frame, relative to base_link, metres and radians.
# Attribute values are strings, as CARLA blueprints take them. Radar sensor_id for the tracker = id without "radar_".
sensors:
  - {id: camera_front, frame: camera_front, blueprint: sensor.camera.rgb,
     mount: {x: 1.5, y: 0.0, z: 1.6, yaw: 0.0},
     attributes: {image_size_x: "1280", image_size_y: "720", fov: "90", sensor_tick: "0.0"}}
  - {id: camera_front_semantic, frame: camera_front, blueprint: sensor.camera.semantic_segmentation,
     mount: {x: 1.5, y: 0.0, z: 1.6, yaw: 0.0},
     attributes: {image_size_x: "1280", image_size_y: "720", fov: "90", sensor_tick: "0.0"}}
  - {id: lidar, frame: lidar_top, blueprint: sensor.lidar.ray_cast,
     mount: {x: 0.0, y: 0.0, z: 1.9, yaw: 0.0},
     attributes: {channels: "64", range: "100", points_per_second: "1300000", rotation_frequency: "20",
                  upper_fov: "10", lower_fov: "-30", dropoff_general_rate: "0.0", sensor_tick: "0.0"}}
  - {id: radar_front, frame: radar_front, blueprint: sensor.other.radar,
     mount: {x: 2.4, y: 0.0, z: 0.7, yaw: 0.0},
     attributes: {horizontal_fov: "30", vertical_fov: "10", range: "100", points_per_second: "1500", sensor_tick: "0.0"}}
  - {id: radar_rear, frame: radar_rear, blueprint: sensor.other.radar,
     mount: {x: -2.4, y: 0.0, z: 0.7, yaw: 3.141592653589793},
     attributes: {horizontal_fov: "30", vertical_fov: "10", range: "100", points_per_second: "1500", sensor_tick: "0.0"}}
  - {id: radar_left, frame: radar_left, blueprint: sensor.other.radar,
     mount: {x: 0.0, y: 1.0, z: 0.7, yaw: 1.5707963267948966},
     attributes: {horizontal_fov: "60", vertical_fov: "10", range: "100", points_per_second: "1500", sensor_tick: "0.0"}}
  - {id: radar_right, frame: radar_right, blueprint: sensor.other.radar,
     mount: {x: 0.0, y: -1.0, z: 0.7, yaw: -1.5707963267948966},
     attributes: {horizontal_fov: "60", vertical_fov: "10", range: "100", points_per_second: "1500", sensor_tick: "0.0"}}
  - {id: imu, frame: imu, blueprint: sensor.other.imu,
     mount: {x: 0.0, y: 0.0, z: 0.5, yaw: 0.0},
     attributes: {sensor_tick: "0.01"}}
