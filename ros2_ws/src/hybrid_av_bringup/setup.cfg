[develop]
script_dir=$base/lib/hybrid_av_bringup
[install]
install_scripts=$base/lib/hybrid_av_bringup

# own pytest config so colcon test does not pick up the repo's addopts (which deselect `ros`)
[tool:pytest]
markers =
    ros: runs inside the ROS 2 dev image
    carla: needs a running CARLA server (pod only)
