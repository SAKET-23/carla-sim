backend: gt  # gt | torch | trt
min_points: 10  # gt label rule (detection-3d.md)
checkpoint: /workspace/checkpoints/pointpillars.pth  # torch backend (OpenPCDet checkpoint)
engine: /workspace/engines/pointpillars.plan  # trt backend
device: cuda
pillars:  # detection-3d.md §3; same values as PillarConfig defaults
  pc_range: [-51.2, -51.2, -1.0, 51.2, 51.2, 5.0]
  voxel: [0.16, 0.16, 6.0]
  max_points: 32
  max_pillars: 16000
  anchors: [[3.9, 1.6, 1.56, 0.78], [0.8, 0.6, 1.73, 0.87], [1.76, 0.6, 1.73, 0.87]]  # l, w, h, z centre: Car, Pedestrian, Cyclist
  rotations: [0.0, 1.5707963267948966]
  score_thresh: 0.3
  nms_iou: 0.01
  max_det: 100
